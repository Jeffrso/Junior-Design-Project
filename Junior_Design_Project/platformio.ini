; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.7.3
; Our board is an ESP32-S3-WROOM-2 N32R16V (32MB octal flash + 16MB octal PSRAM).
; Without these it crash-loops on boot ("assert failed: do_core_init ... flash_ret == ESP_OK").
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 32MB
; send Serial over the native USB port (the one labeled "USB") instead of the UART port
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
